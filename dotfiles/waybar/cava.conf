# Sound bars: the speakers half, i.e. what is playing (custom/cava in modules/home/desktop.nix).
[general]
framerate = 30
bars = 12
autosens = 1

[input]
# The output you're listening to, through PipeWire directly.
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 77
