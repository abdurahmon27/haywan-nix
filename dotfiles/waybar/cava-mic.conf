# Sound bars: the microphone half (custom/cava in modules/home/desktop.nix).
# cava.sh fills in @SOURCE@ with the default mic when it starts.
[general]
framerate = 30
bars = 12
# Fixed, not autosens: autosens turns up the gain in a quiet room until fan noise
# fills the bars. 50 keeps a quiet room flat; a voice right at the laptop shows.
autosens = 0
sensitivity = 50

[input]
method = pipewire
source = @SOURCE@

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 77
