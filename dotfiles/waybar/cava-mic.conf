# Sound bars: the microphone half (custom/cava in modules/home/desktop.nix).
# cava.sh fills in @SOURCE@ with the default mic when it starts.
[general]
framerate = 30
bars = 12
# Fixed, not autosens: autosens turns up the gain in a quiet room until fan noise
# fills the bars. Background noise is gated in cava.sh instead (it follows the
# room's level). The default here; scroll on the bars to tune it for your room
# (saved in ~/.local/state/waybar-cava/mic-sensitivity).
autosens = 0
sensitivity = 130
# Voice only: below 150 Hz is mostly fan and desk rumble, above 5 kHz hiss.
lower_cutoff_freq = 150
higher_cutoff_freq = 5000

[input]
method = pipewire
source = @SOURCE@

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 77
