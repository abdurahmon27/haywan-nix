# Lock screen look — Gruvbox Material, same palette as Waybar and ReGreet.
# bg #282828  fg #d4be98  gray #a89984  orange #e78a4e  red #ea6962
# $clock (the block-digit clock script) and the fingerprint settings come from
# modules/home/desktop.nix, which prepends them to this file.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
    vibrancy = 0.1
}

# Clock, clock-rs style
label {
    monitor =
    text = cmd[update:1000] $clock
    color = rgb(e78a4e)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(a89984)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 42
    outline_thickness = 1
    rounding = 10
    dots_size = 0.22
    dots_spacing = 0.35
    outer_color = rgba(d4be9826)
    inner_color = rgba(282828cc)
    font_color = rgb(d4be98)
    check_color = rgb(e78a4e)
    fail_color = rgb(ea6962)
    fail_text = $FAIL
    placeholder_text =
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

# Fingerprint status ("touch the sensor…", "scanning…")
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgb(928374)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -110
    halign = center
    valign = center
}
