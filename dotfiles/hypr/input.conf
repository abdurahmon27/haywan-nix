# ===================================================
#
#            [ Input/Device Configuation ]
# 
# ===================================================


# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

# Hyprland 0.55 turns swipes on with the `gesture` keyword instead of
# gestures:workspace_swipe. Syntax: gesture = <fingers>, <direction>, <action>
gesture = 3, horizontal, workspace

gestures {
    # See https://wiki.hypr.land/Configuring/Variables/ for more
    workspace_swipe_distance = 200
    workspace_swipe_min_speed_to_force = 0
}


# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
