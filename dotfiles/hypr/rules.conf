# ===================================================
#
#              [ Rules Configuation ]
# 
# ===================================================

# Hyprland 0.55 uses "windowrule v3": a block with a `name`, `match:<prop>`
# matchers and effect fields. windowrulev2 is now a hard error.
# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
#
# Example:
#   windowrule {
#       name = float-kitty
#       match:class = ^(kitty)$
#       float = true
#   }

# You'll probably like this one.
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

