# ===================================================
#
#              [ Key Binding Configuation ]
# 
# ===================================================

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod SHIFT, Q, exec, hyprctl dispatch exit
bind = $mainMod, Escape, exec, pidof hyprlock || hyprlock # lock screen

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive, 
bind = $mainMod, I, exec, $fileManager
bind = $mainMod, V, togglefloating, 
bind = $mainMod, S, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, B, exec, $browser

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Switch to previous/next workspace with mainMod + arrows
bind = $mainMod, left, workspace, e-1
bind = $mainMod, right, workspace, e+1

# Switch to previous/next workspace with mouse side buttons
bind = , mouse:275, workspace, e+1
bind = , mouse:276, workspace, e-1

# Move active window to previous/next workspace with mainMod + SHIFT + arrows
bind = $mainMod SHIFT, left, movetoworkspace, e-1
bind = $mainMod SHIFT, right, movetoworkspace, e+1

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Full view: real fullscreen, so the window also covers both Waybars (they're on the
# "top" layer, which fullscreen windows sit above); press again to bring them back.
bind = $mainMod, M, fullscreen, 0

# Screen Snipping
# Save to file 
# bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'screenshot_%Y-%m-%d-%H%M%S.png') 
# Save to clipboard
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
# Whole screen (the monitor you're on) to the clipboard
bind = $mainMod SHIFT, A, exec, grim -o "$(hyprctl monitors -j | jq -r '.[] | select(.focused) | .name')" - | wl-copy

# Notifications: open the panel, or toggle do-not-disturb
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, N, exec, swaync-client -d -sw

# Volume Control
# -l 1: stop at 100% (wpctl otherwise keeps going to 150% and beyond)
bindel =, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel =, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Screen Brightness Control
bindel =, XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel =, XF86MonBrightnessDown, exec, brightnessctl set 5%-

# rofi
bind = $mainMod, SPACE, exec, $menu

# Wallpapers: skip to the next one right away (the loop animates between them).
bind = $mainMod, W, exec, $wallpaperNext

# Caffeine: keep the screen from locking / turning off while idle (toggle)
bind = $mainMod SHIFT, C, exec, $caffeine
